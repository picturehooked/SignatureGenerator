<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crosswind Capital — Email Signature Generator</title>
<style>
  /* =================================================================
     GLOBAL CONFIGURABLE CONSTANTS (mirrored in JS as CONFIG)
     Keep colours/typography here only for the APP CHROME.
     The signature itself is rendered with inline styles (email-safe).
     ================================================================= */
  :root{
    --navy:#163A5F;          /* brand navy  */
    --gold:#C4A041;          /* brand gold  */
    --gate-blue:#213c57;     /* solid blue password screen background */
    --app-bg:#eef1f4;
    --panel:#ffffff;
    --line:#d7dde3;
    --font: "Aptos","Segoe UI",Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--app-bg);
    color:var(--navy);
    -webkit-text-size-adjust:100%;
  }

  /* ---------- PASSWORD GATE ---------- */
  #gate{
    position:fixed;inset:0;z-index:1000;
    background:var(--gate-blue);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  /* Left-aligned heading, sized to the password input column. */
  #gate .gate-inner{width:100%;max-width:420px;text-align:left;color:#fff;}
  #gate h1{
    font-weight:400;font-size:26px;letter-spacing:.3px;margin:0 0 28px;
    font-style:italic;text-align:left;
  }
  /* Row = [input + message column] then the Enter button to its right.
     Aligning items to the top lines the button up with the input, while the
     fail message sits under the input and shares its exact width. */
  #gate .gate-row{display:flex;gap:10px;align-items:flex-start;}
  #gate .gate-field{flex:1 1 auto;min-width:0;}
  #gate input[type="password"]{
    width:100%;
    font-family:var(--font);font-size:16px;
    padding:14px 16px;border:none;border-radius:8px;outline:none;
    background:#ffffff;color:var(--navy);
  }
  #gate button{
    flex:0 0 auto;
    font-family:var(--font);font-size:16px;font-weight:600;
    padding:14px 26px;border:none;border-radius:8px;cursor:pointer;
    background:var(--gold);color:#1a1a1a;
    min-height:48px;
  }
  #gate button:active{transform:translateY(1px);}
  /* Fail text: same font/size/style as the heading, red, right-aligned to the
     right edge of the input (it lives inside the input column). */
  #gateMsg{
    margin-top:16px;min-height:31px;
    font-weight:400;font-size:26px;letter-spacing:.3px;font-style:italic;
    line-height:1.2;color:#ff5b5b;text-align:right;
  }

  /* ---------- APP LAYOUT ---------- */
  #app{display:none;max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
  .app-head{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .app-head h2{font-size:20px;font-weight:600;margin:0;}
  .app-head .sub{font-size:13px;color:#5a6b7b;}

  .grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start;}
  /* min-width:0 lets tracks shrink below content min-content, so an
     overlong preview scrolls INSIDE its box instead of widening the page. */
  .grid > *{min-width:0;}
  @media (max-width:860px){ .grid{grid-template-columns:minmax(0,1fr);} }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--navy);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#41535f;margin-bottom:6px;}
  .field input[type="text"]{
    width:100%;font-family:var(--font);font-size:15px;color:var(--navy);
    padding:11px 12px;border:1px solid var(--line);border-radius:8px;outline:none;
    background:#fbfcfd;min-height:44px;
  }
  .field input:focus{border-color:var(--navy);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:420px){ .two-col{grid-template-columns:1fr;} }

  .file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .file-row .logo-thumb{height:40px;width:auto;max-width:160px;object-fit:contain;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;}
  .btn{
    font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;
    padding:11px 16px;border-radius:8px;border:1px solid var(--navy);
    background:var(--navy);color:#fff;min-height:44px;
  }
  .btn.secondary{background:#fff;color:var(--navy);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1a1a;}
  .btn.bluegold{background:var(--navy);border-color:var(--navy);color:var(--gold);}
  .btn.goldblue{background:var(--gold);border-color:var(--gold);color:var(--navy);}
  .btn:active{transform:translateY(1px);}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}

  .toggle-row{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 12px;font-size:13.5px;}
  .toggle-row label{display:flex;align-items:center;gap:7px;cursor:pointer;color:#41535f;}
  .hosted-url{margin-top:4px;}

  /* ---------- PREVIEW ---------- */
  .preview-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:26px 18px;overflow-x:auto;}
  .preview-label{font-size:12px;color:#7c8a97;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:10px;}
  /* The signature container centres every section on one master centreline. */
  #signature{display:inline-block;}
  .preview-scroll{text-align:center;}

  .note{font-size:12px;color:#76808a;margin-top:10px;line-height:1.5;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:1200;}
  .toast.show{opacity:1;}

  /* hidden measuring node (off-screen, same fonts) */
  #measure{position:absolute;left:-99999px;top:-99999px;white-space:nowrap;visibility:hidden;}
</style>
</head>
<body>

<!-- =====================================================================
     SECTION 1 — PASSWORD GATE
     Lightweight client-side access screen. No persistence, no cookies.
     ===================================================================== -->
<div id="gate">
  <div class="gate-inner">
    <h1>If you know, you know.</h1>
    <div class="gate-row">
      <div class="gate-field">
        <input id="gatePass" type="password" inputmode="text" autocomplete="off"
               placeholder="Password" aria-label="Password">
        <div id="gateMsg" role="status" aria-live="polite"></div>
      </div>
      <button id="gateBtn" type="button">Enter</button>
    </div>
  </div>
</div>

<!-- =====================================================================
     SECTION 2 — GENERATOR APP
     ===================================================================== -->
<div id="app">
  <div class="app-head">
    <div>
      <h2>Crosswind Capital — Email Signature Generator</h2>
    </div>
  </div>

  <div class="grid">
    <!-- ---------- FORM ---------- -->
    <div class="panel" id="formPanel">
      <h3>Details</h3>

      <!-- Logo upload hidden: the logo is fixed and served from the hosted URL.
           Kept in the DOM (display:none) so existing handlers stay valid. -->
      <div class="field" style="display:none;">
        <label for="f_logo">Logo (PNG)</label>
        <div class="file-row">
          <input id="f_logo" type="file" accept="image/png,image/*">
          <img id="logoThumb" class="logo-thumb" alt="logo preview">
        </div>
      </div>

      <div class="field">
        <label for="f_name">Name</label>
        <input id="f_name" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="f_title">Title</label>
        <input id="f_title" type="text" autocomplete="off">
      </div>

      <div class="two-col">
        <div class="field"><label for="f_tel1">Telephone 1 (required)</label><input id="f_tel1" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_tel2">Telephone 2</label><input id="f_tel2" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_tel3">Telephone 3</label><input id="f_tel3" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_tel4">Telephone 4</label><input id="f_tel4" type="text" autocomplete="off"></div>
      </div>

      <div class="two-col">
        <div class="field"><label for="f_loc1">Location 1</label><input id="f_loc1" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_loc2">Location 2</label><input id="f_loc2" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_loc3">Location 3</label><input id="f_loc3" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_loc4">Location 4</label><input id="f_loc4" type="text" autocomplete="off"></div>
      </div>

      <div class="btn-row">
        <button class="btn secondary" type="button" id="btnRestore">Restore Defaults</button>
      </div>
    </div>

    <!-- ---------- PREVIEW + EXPORT ---------- -->
    <div>
      <div class="preview-wrap">
        <div class="preview-label">Live preview</div>
        <div class="preview-scroll">
          <div id="signature"><!-- rendered signature injected here --></div>
        </div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <h3>Export</h3>
        <div class="btn-row" style="justify-content:space-between;">
          <button class="btn goldblue" type="button" id="btnCopyImg">Copy as Image</button>
          <button class="btn bluegold" type="button" id="btnCopySig">Copy with Links</button>
        </div>
        <div class="note" id="exportNote"></div>
      </div>
    </div>
  </div>
</div>

<div id="measure"></div>
<div class="toast" id="toast"></div>

<script>

   CONFIG — single source of truth for colours, typography and layout.
   ===================================================================== */
const CONFIG = {
  navy: "#163A5F",
  gold: "#C4A041",
  // Single quotes inside the family list so the stack can sit safely inside
  // double-quoted inline style="" attributes in the exported HTML.
  fontStack: "'Aptos','Segoe UI',Arial,sans-serif",
  // Type scale (px) and weights, per specification.
  type: {
    name:    { size:18, weight:700 },
    title:   { size:16, weight:400 },
    tel:     { size:14, weight:400 },
    web:     { size:14, weight:400 },
    location:{ size:13, weight:400 }

  // signature container. Every section is centred within that container,
  // so the centreline is fixed and never moves regardless of content.

                           // variable: it grows to max(base, widest content) so
                           // the gold rules (logo x 105%) always span the content.
  ruleRatio: 1.05,         // gold rule width = 105% of FINAL logo width
  dividerPad: 13,          // MANDATORY 13px clear space either side of every divider
  dividerColWidth: 1,      // dividers are 1px solid vertical lines (not glyphs)
  dividerHeight: 14,       // FIXED divider line height. Never derived from type
                           // size, so dividers do not respond to typography.
  rowGap: 9,               // vertical gap between contact rows
  logoToRule: 3,           // fixed gap under logo, above the upper rule (raised
                           // 5px from 8). Never scales with logo/content.
  ruleToContact: 14,       // space under upper rule, above contact block
  contactToRule: 14,       // space under contact block, above lower rule
  ruleToLocation: 12,      // space under lower rule, above location row
  panelPadding: 20         // white panel padding around the whole signature
                           // (keeps it legible on dark-mode surfaces)
};

const LOGO_NATURAL = { w:1600, h:485 }; // supplied PNG, bottom whitespace trimmed

                                        // the logo-to-rule gap. Host crosswind-logo-trimmed.png
                                        // for hosted-URL export to keep proportions identical.

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  // Preview and PNG use the embedded raster (no CORS taint on canvas); the
  // exported HTML always references the hosted logo URL.
  logoSrc: LOGO_DATA_URI
};

const $ = id => document.getElementById(id);
const FIELD_IDS = ["name","title","tel1","tel2","tel3","tel4","loc1","loc2","loc3","loc4"];

/* =====================================================================
   SECTION 1 — PASSWORD GATE LOGIC
   ===================================================================== */
const PASSWORD = "PANpan26";
function attemptUnlock(){
  const val = $("gatePass").value;
  if (val === PASSWORD){
    $("gate").style.display = "none";
    $("app").style.display = "block";
    render(); // first paint once visible (measurement needs layout)
  } else {
    $("gateMsg").textContent = "…evidently, you didn't know!";
    $("gatePass").select();
  }
}
$("gateBtn").addEventListener("click", attemptUnlock);
$("gatePass").addEventListener("keydown", e => { if (e.key === "Enter") attemptUnlock(); });

/* =====================================================================
   MEASUREMENT HELPER
   ---------------------------------------------------------------------
   Layout is calculated from MEASURED content widths (never hardcoded).
   We render text into an off-screen node with the exact font and read
   its pixel width. This drives the centreline zone calculations and is
   reused for both the preview and the exported HTML so they match.
   ===================================================================== */
const measureNode = $("measure");
function measureWidth(html, sizePx, weight){
  measureNode.style.fontFamily = CONFIG.fontStack;
  measureNode.style.fontSize = sizePx + "px";
  measureNode.style.fontWeight = weight;
  measureNode.innerHTML = html;
  return Math.ceil(measureNode.getBoundingClientRect().width);
}

/* =====================================================================
   SECTION 3 — SIGNATURE RENDERING ENGINE
   ---------------------------------------------------------------------
   buildSignatureHTML() returns Outlook-safe, table-based, inline-styled
   HTML. The SAME output is used for the live preview and for export
   (only the logo <img> src differs), guaranteeing visual parity.

   CENTRELINE PRINCIPLE
   Every section is a table with margin:0 auto, so each section is
   centred within the signature container. The container's horizontal
   centre is the immovable master centreline. Two-zone rows are built
   from five fixed-width columns laid out symmetrically:

        [ leftZone ][ 13px ][ divider ][ 13px ][ rightZone ]
          = Z          pad      col       pad      = Z

   Because leftZone === rightZone (both = Z, the governing width) and the
   left/right pads are equal, the divider column is exactly centred in the
   table, hence on the master centreline. All rows share the SAME Z, so
   every divider lines up and the left/right content boundaries are
   identical across rows.
   ===================================================================== */

// Escape user text for safe HTML injection.
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// Inline font style string for a given type role.
function fontStyle(role, colour){
  const t = CONFIG.type[role];
  return `font-family:${CONFIG.fontStack};font-size:${t.size}px;`
       + `font-weight:${t.weight};color:${colour};line-height:1.25;`;
}

/* A vertical gold divider rendered as a 1px SOLID LINE (a separate visual
   element, NOT a text glyph). Its height is the fixed CONFIG.dividerHeight,
   so it never inherits font-weight or responds to typography. Built as a
   nested 1px-wide, fixed-height cell with a gold background — the most
   reliable cross-client way to draw a hairline (Outlook included). */
function vline(){
  const h = CONFIG.dividerHeight;
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    + `style="border-collapse:collapse;margin:0 auto;"><tr>`
    + `<td width="1" height="${h}" style="width:1px;height:${h}px;line-height:${h}px;`
    + `font-size:1px;background-color:${CONFIG.gold};">&nbsp;</td></tr></table>`;
}
// The centre divider cell: a 1px column holding the vertical line, centred.
function dividerCell(){
  return `<td width="1" align="center" valign="middle" style="width:1px;padding:0;">`
    + vline() + `</td>`;
}
// A fixed-width transparent spacer cell (the 13px clear zone).
function padCell(){
  return `<td width="${CONFIG.dividerPad}" style="width:${CONFIG.dividerPad}px;`
       + `padding:0;font-size:1px;line-height:1px;">&nbsp;</td>`;
}

/* Build a two-value row centred on the master centreline.
   leftInner / rightInner are ready-to-place HTML (already font-styled).
   Z = governing half-zone width (px). dividerSize = glyph font size. */
function zoneRowWidth(Z){
  return 2*Z + 2*CONFIG.dividerPad + CONFIG.dividerColWidth;
}
function twoZoneRow(leftInner, rightInner, Z){
  // Explicit table width + table-layout:fixed clamps both side columns to
  // EXACTLY Z, so the symmetric column set keeps the 1px divider dead-centre
  // on the master centreline. Without an explicit width a tight column can
  // expand and shift the divider a few px off the line.
  const total = zoneRowWidth(Z);
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    + `width="${total}" style="width:${total}px;border-collapse:collapse;margin:0 auto;table-layout:fixed;">`
    + `<tr>`
    // Column 1 is LEFT-aligned (its left edge is pinned to the logo's left
    // edge because the contact block spans the full logo width). Column 2
    // stays left-aligned starting 13px after the centre divider.
    + `<td width="${Z}" align="left" valign="middle" style="width:${Z}px;padding:0;white-space:nowrap;">${leftInner}</td>`
    + padCell()
    + dividerCell()
    + padCell()
    + `<td width="${Z}" align="left" valign="middle" style="width:${Z}px;padding:0;white-space:nowrap;">${rightInner}</td>`
    + `</tr></table>`;
}

/* Single-value row (e.g. only Telephone 1, or a lone Telephone 3).
   Specification: NO centring. The value is LEFT-aligned within the left
   column boundary, the centre divider does NOT render, and the right column
   stays empty. The full-width fixed table preserves the master-centreline
   coordinate system so the left column lines up with every other row. */
function leftZoneRow(inner, Z){
  const total = zoneRowWidth(Z);
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    + `width="${total}" style="width:${total}px;border-collapse:collapse;margin:0 auto;table-layout:fixed;">`
    + `<tr>`
    + `<td width="${Z}" align="left" valign="middle" style="width:${Z}px;padding:0;white-space:nowrap;">${inner}</td>`
    + padCell()
    + `<td width="1" style="width:1px;padding:0;font-size:1px;line-height:1px;">&nbsp;</td>` // divider column: deliberately empty
    + padCell()
    + `<td width="${Z}" style="width:${Z}px;padding:0;font-size:1px;line-height:1px;">&nbsp;</td>` // empty right column, no placeholder content
    + `</tr></table>`;
}

// A horizontal gold rule (1px) of a given width, centred.
function goldRule(widthPx){
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    + `style="border-collapse:collapse;margin:0 auto;">`
    + `<tr><td width="${widthPx}" height="1" `
    + `style="width:${widthPx}px;height:1px;line-height:1px;font-size:1px;`
    + `background-color:${CONFIG.gold};">&nbsp;</td></tr></table>`;
}

// Vertical spacer row.
function vSpace(px){
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    + `style="border-collapse:collapse;margin:0 auto;"><tr>`
    + `<td height="${px}" style="height:${px}px;line-height:${px}px;font-size:1px;">&nbsp;</td>`
    + `</tr></table>`;
}

// Anchor builder. Default link styling is brand GOLD (never grey/default UA
// colour); colour is forced inline so visited/default link colours can't apply.
// colour and underline can be explicitly overridden per link.
function link(text, url, role, colour, underline){
  const c = colour || CONFIG.gold;
  const deco = underline ? "underline" : "none";
  return `<a href="${esc(url)}" target="_blank" `
    + `style="${fontStyle(role, c)}text-decoration:${deco};">${esc(text)}</a>`;
}

// Plain styled span.
function span(text, role){
  return `<span style="${fontStyle(role, CONFIG.navy)}">${esc(text)}</span>`;
}

// Arithmetic width of an inner location group: text(a) + text(b) plus, when
// both exist, the 1px divider line and its 13px clear space either side.
function locationGroupWidth(a, b){
  let w = (a ? measureWidth(esc(a),13,400) : 0) + (b ? measureWidth(esc(b),13,400) : 0);
  if (a && b) w += 2*CONFIG.dividerPad + CONFIG.dividerColWidth;
  return w;
}
// Inner location group "Loc A | Loc B" as a nested table with a 1px line
// divider and 13px either side. floatDir floats the group to the right
// boundary of the left zone (align="right") or the left boundary of the
// right zone (align="left"), so the centre divider stays on the centreline.
function locationGroup(a, b, floatDir){
  const cell = t => `<td valign="middle" style="padding:0;white-space:nowrap;${fontStyle('location',CONFIG.navy)}">${esc(t)}</td>`;
  const cells = [];
  if (a) cells.push(cell(a));
  if (a && b){ cells.push(padCell()); cells.push(dividerCell()); cells.push(padCell()); }
  if (b) cells.push(cell(b));
  if (!cells.length) return "&nbsp;";
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="${floatDir}" `
    + `style="border-collapse:collapse;">` + `<tr>` + cells.join("") + `</tr></table>`;
}

/* MAIN BUILDER --------------------------------------------------------
   data: field values. logoSrc: image to use for the <img>. */
function buildSignatureHTML(data, logoSrc){
  const pad = CONFIG.dividerPad, dCol = CONFIG.dividerColWidth;

  // ---- Measure widest single CONTACT value (Zc) ----
  const contactItems = [
    [esc(data.name),  "name"],
    [esc(data.title), "title"],
    [esc(LINKS.websiteText), "web"],
    [esc(LINKS.insightsText),"web"]
  ];
  [data.tel1,data.tel2,data.tel3,data.tel4].forEach(t=>{
    if (t) contactItems.push([esc(t),"tel"]);
  });
  let Zc = 0;
  contactItems.forEach(([html,role])=>{
    const t = CONFIG.type[role];
    Zc = Math.max(Zc, measureWidth(html, t.size, t.weight));
  });
  Zc = Math.max(Zc, 40); // sensible floor

  // ---- Measure location group widths (Zl) ----
  const Zl = Math.max(
    locationGroupWidth(data.loc1, data.loc2),
    locationGroupWidth(data.loc3, data.loc4),
    20
  );

  // ---- System width & DEPENDENT logo --------------------------------
  // The contact block spans the FULL logo width so column 1's left edge is
  // pinned exactly to the logo's left edge. System width must therefore cover
  // the base logo, the widest contact content and the location row. The logo
  // (and the gold rules at logo x 105%) grow to that width and never bind to
  // text edges.
  const contactContentW = 2*Zc + 2*pad + dCol;
  const locationTotal   = zoneRowWidth(Zl);
  const systemW = Math.max(CONFIG.logoWidth, contactContentW, locationTotal);
  // Contact governing half-zone sized so the contact block width == logo width.
  const Z = Math.ceil((systemW - 2*pad - dCol) / 2);
  const logoW = zoneRowWidth(Z);                       // == contact block width
  const logoH = Math.round(logoW * LOGO_NATURAL.h / LOGO_NATURAL.w);
  const ruleW = Math.round(logoW * CONFIG.ruleRatio);  // 105% of FINAL logo width

  // ---- Contact rows (column 1 LEFT-aligned to the logo's left edge) ----
  let rows = "";
  // Row 1: Name | Title
  rows += twoZoneRow(span(data.name,"name"), span(data.title,"title"), Z);

  // Row 2/3: telephones, per layout rules. Single values (1 number, or the
  // lone 3rd of three) are NEVER centred: left-aligned, no divider.
  const tels = [data.tel1,data.tel2,data.tel3,data.tel4].filter(t=>t && t.trim()!=="");
  function telRows(){
    const out = [];
    if (tels.length === 0) return out;
    if (tels.length === 1){
      out.push(leftZoneRow(span(tels[0],"tel"), Z));
    } else if (tels.length === 2){
      out.push(twoZoneRow(span(tels[0],"tel"), span(tels[1],"tel"), Z));
    } else if (tels.length === 3){
      out.push(twoZoneRow(span(tels[0],"tel"), span(tels[1],"tel"), Z));
      out.push(leftZoneRow(span(tels[2],"tel"), Z));
    } else { // 4
      out.push(twoZoneRow(span(tels[0],"tel"), span(tels[1],"tel"), Z));
      out.push(twoZoneRow(span(tels[2],"tel"), span(tels[3],"tel"), Z));
    }
    return out;
  }
  telRows().forEach(r => { rows += vSpace(CONFIG.rowGap) + r; });

  // Row 4: Website (blue, underlined) | Insights & Research (gold, no underline)
  rows += vSpace(CONFIG.rowGap)
       + twoZoneRow(link(LINKS.websiteText,  LINKS.websiteUrl,  "web", CONFIG.navy, true),
                    link(LINKS.insightsText, LINKS.insightsUrl, "web", CONFIG.gold, false),
                    Z);

  // ---- Location row (own governing width; centre divider on centreline) ----
  const locationRow = twoZoneRow(
    locationGroup(data.loc1, data.loc2, "right"),
    locationGroup(data.loc3, data.loc4, "left"),
    Zl
  );

  // Embedded raster (preview/data URI) gets a fixed height; a hosted logo
  // (which may be an SVG of unknown aspect ratio) is given width + auto height
  // so it can never be distorted.
  const embedded = /^data:/.test(logoSrc);
  const logoImg = embedded
    ? `<img src="${esc(logoSrc)}" width="${logoW}" height="${logoH}" `
      + `alt="Crosswind Capital Fund Management Limited" `
      + `style="display:block;width:${logoW}px;height:${logoH}px;border:0;outline:none;`
      + `text-decoration:none;-ms-interpolation-mode:bicubic;">`
    : `<img src="${esc(logoSrc)}" width="${logoW}" `
      + `alt="Crosswind Capital Fund Management Limited" `
      + `style="display:block;width:${logoW}px;height:auto;border:0;outline:none;`
      + `text-decoration:none;-ms-interpolation-mode:bicubic;">`;

  // The signature itself.
  const inner = ``
    + `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    +   `style="border-collapse:collapse;margin:0 auto;">`
    + `<tr><td align="center" style="text-align:center;">`
    +   `<table role="presentation" cellpadding="0" cellspacing="0" border="0" `
    +     `style="border-collapse:collapse;margin:0 auto;"><tr><td align="center">${logoImg}</td></tr></table>`
    +   vSpace(CONFIG.logoToRule)
    +   goldRule(ruleW)
    +   vSpace(CONFIG.ruleToContact)
    +   rows
    +   vSpace(CONFIG.contactToRule)
    +   goldRule(ruleW)
    +   vSpace(CONFIG.ruleToLocation)
    +   locationRow
    + `</td></tr></table>`;

  // White panel wrapper. An explicit white background (bgcolor + inline style)
  // keeps the navy text and gold rules legible and professional in dark-mode
  // clients, which would otherwise place the signature on a dark surface.
  const padPx = CONFIG.panelPadding;
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" `
    + `style="border-collapse:collapse;margin:0 auto;background-color:#ffffff;">`
    + `<tr><td bgcolor="#ffffff" align="center" `
    + `style="background-color:#ffffff;padding:${padPx}px;text-align:center;">`
    + inner
    + `</td></tr></table>`;
}

/* =====================================================================
   FORM <-> STATE
   ===================================================================== */
function readForm(){
  const d = {};
  FIELD_IDS.forEach(k => d[k] = $("f_"+k).value.trim());
  return d;
}
function writeForm(values){
  FIELD_IDS.forEach(k => $("f_"+k).value = values[k] != null ? values[k] : "");
}

/* =====================================================================
   RENDER (live preview)
   ===================================================================== */
function render(){
  const data = readForm();
  $("signature").innerHTML = buildSignatureHTML(data, state.logoSrc);
}

/* =====================================================================
   SECTION 4 — HTML EXPORT ENGINE
   ===================================================================== */
// Every export references the hosted logo URL.
function exportLogoSrc(){ return HOSTED_LOGO_URL; }
// The signature fragment alone (what gets pasted into a signature field).
function buildExportSignature(){
  return buildSignatureHTML(readForm(), exportLogoSrc());
}
function buildExportDocument(){
  const sig = buildExportSignature();
  // A minimal, email-friendly wrapper. The signature itself is fully
  // inline-styled and table-based, so it survives paste into mail clients.
  return `<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Crosswind Capital Signature</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<!-- Crosswind Capital email signature -->
${sig}
</body>
</html>`;
}

function flashToast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(flashToast._t);
  flashToast._t = setTimeout(()=>t.classList.remove("show"), 1900);
}

async function copyHtml(){
  const html = buildExportDocument();
  try{
    await navigator.clipboard.writeText(html);
    flashToast("HTML copied to clipboard");
  }catch(e){
    // Fallback for older / insecure contexts.
    const ta = document.createElement("textarea");
    ta.value = html; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); flashToast("HTML copied to clipboard"); }
    catch(_){ flashToast("Copy failed — select and copy manually"); }
    document.body.removeChild(ta);
  }
}
function downloadHtml(){
  const blob = new Blob([buildExportDocument()], {type:"text/html"});
  triggerDownload(blob, "crosswind-signature.html");
  flashToast("HTML downloaded");
}

/* Copy for Signature: copies the RENDERED signature to the clipboard (rich
   HTML), reproducing "download, open in browser, select all, copy". Pasting
   into a signature field then yields the formatted signature, not code.
   Primary method = select a contenteditable holder + execCommand('copy'),
   which carries rich content and works on file://. Falls back to the async
   Clipboard API with a text/html payload. */
async function copyForSignature(){
  const html = buildExportSignature();
  const holder = document.createElement("div");
  holder.setAttribute("contenteditable", "true");
  holder.style.cssText = "position:fixed;left:-99999px;top:0;white-space:normal;";
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const range = document.createRange();
  range.selectNodeContents(holder);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(holder);
  if (ok){ flashToast("Signature copied — paste into your signature field"); return; }
  // Fallback: async Clipboard API with rich + plain payloads.
  try {
    await navigator.clipboard.write([new ClipboardItem({
      "text/html":  new Blob([html], {type:"text/html"}),
      "text/plain": new Blob([html], {type:"text/plain"})
    })]);
    flashToast("Signature copied — paste into your signature field");
  } catch (e){
    flashToast("Copy failed — use Download HTML instead");
  }
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* =====================================================================
   SECTION 5 — PNG EXPORT ENGINE (no libraries; hand-drawn canvas)
   ---------------------------------------------------------------------
   Mirrors the same centreline layout maths on a high-DPI canvas.
   PNG is for visual use only (not the preferred email format).
   ===================================================================== */
function fontFor(role){
  const t = CONFIG.type[role];
  return `${t.weight} ${t.size}px ${CONFIG.fontStack}`;
}
function measureCanvas(ctx, text, role){
  ctx.font = fontFor(role);
  return Math.ceil(ctx.measureText(text).width);
}

// Renders the whole signature to a canvas, then calls onReady(canvas).
function renderSignatureCanvas(onReady){
  const data = readForm();
  const dpr = Math.max(2, window.devicePixelRatio || 1);
  const cvs = document.createElement("canvas");
  const ctx = cvs.getContext("2d");

  // --- Geometry (CSS px) ---
  const PAD = 24;                                  // outer padding
  const pad = CONFIG.dividerPad;
  const dCol = CONFIG.dividerColWidth;             // 1px divider line
  const dH = CONFIG.dividerHeight;                 // fixed divider height

  // Contact governing half-width Zc (widest single value).
  let Zc = 40;
  Zc = Math.max(Zc, measureCanvas(ctx, data.name, "name"));
  Zc = Math.max(Zc, measureCanvas(ctx, data.title, "title"));
  Zc = Math.max(Zc, measureCanvas(ctx, LINKS.websiteText, "web"));
  Zc = Math.max(Zc, measureCanvas(ctx, LINKS.insightsText, "web"));
  [data.tel1,data.tel2,data.tel3,data.tel4].forEach(t=>{
    if (t) Zc = Math.max(Zc, measureCanvas(ctx, t, "tel"));
  });
  const contactContentW = 2*Zc + 2*pad + dCol;

  // Location group widths (1px line + 13px either side when both names exist).
  const tels = [data.tel1,data.tel2,data.tel3,data.tel4].filter(t=>t && t.trim()!=="");
  function locGroupW(a,b){
    let w = 0;
    if (a) w += measureCanvas(ctx, a, "location");
    if (b) w += measureCanvas(ctx, b, "location");
    if (a && b) w += dCol + 2*pad;
    return w;
  }
  const Zl = Math.max(20, locGroupW(data.loc1,data.loc2), locGroupW(data.loc3,data.loc4));
  const locTotal = 2*Zl + 2*pad + dCol;

  // Dependent logo: contact block spans the FULL logo width so column 1's
  // left edge is pinned to the logo's left edge. System width covers base
  // logo, widest contact content and the location row.
  const systemW = Math.max(CONFIG.logoWidth, contactContentW, locTotal);
  const Zcz = Math.ceil((systemW - 2*pad - dCol) / 2); // contact governing zone
  const logoW = 2*Zcz + 2*pad + dCol;                  // == contact block width
  const logoH = Math.round(logoW * LOGO_NATURAL.h / LOGO_NATURAL.w);
  const ruleW = Math.round(logoW * CONFIG.ruleRatio);
  const leftEdge = -logoW/2;                            // logo/column-1 left edge, relative to cx

  // Row heights (name is now 18px -> ~24px line box).
  const rowH = { name:24, tel:20, web:20, loc:19 };
  const gap = CONFIG.rowGap;

  // Count contact rows for height.
  let contactRowCount = 1; // name row
  if (tels.length === 1) contactRowCount += 1;
  else if (tels.length === 2) contactRowCount += 1;
  else if (tels.length === 3) contactRowCount += 2;
  else if (tels.length === 4) contactRowCount += 2;
  contactRowCount += 1; // website row

  const contentW = Math.max(ruleW, logoW, locTotal);
  const canvasW = contentW + PAD*2;

  let y = PAD;
  y += logoH + CONFIG.logoToRule + 1 + CONFIG.ruleToContact;
  const contactBlockH = rowH.name
    + (tels.length>=1 ? (gap + rowH.tel) : 0)
    + (tels.length>=3 ? (gap + rowH.tel) : 0)
    + gap + rowH.web;
  y += contactBlockH + CONFIG.contactToRule + 1 + CONFIG.ruleToLocation + rowH.loc;
  const canvasH = y + PAD;

  // --- Size the canvas (high-DPI) ---
  cvs.width = Math.round(canvasW * dpr);
  cvs.height = Math.round(canvasH * dpr);
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvasW,canvasH);
  ctx.textBaseline = "middle";

  const cx = canvasW / 2; // master centreline

  // --- Draw helpers ---
  // 1px solid gold vertical line, fixed height, centred at (centreX, midY).
  function drawDivider(centreX, midY){
    ctx.fillStyle = CONFIG.gold;
    ctx.fillRect(Math.round(centreX) - 0.5, midY - dH/2, dCol, dH);
  }
  function drawTwoZone(left, leftRole, right, rightRole, midY, opts){
    opts = opts || {};
    // Column 1: LEFT-aligned at the logo's left edge.
    ctx.fillStyle = opts.leftColor || CONFIG.navy;
    ctx.textAlign = "left"; ctx.font = fontFor(leftRole);
    const lx = cx + leftEdge;
    ctx.fillText(left, lx, midY);
    // Column 2: left-aligned, starting 13px after the centre divider.
    ctx.fillStyle = opts.rightColor || CONFIG.navy;
    ctx.font = fontFor(rightRole);
    const rx = cx + dCol/2 + pad;
    ctx.fillText(right, rx, midY);
    const uy = midY + CONFIG.type[leftRole].size*0.45;
    if (opts.leftUnderline){ ctx.fillStyle = opts.leftColor || CONFIG.navy;
      ctx.fillRect(lx, uy, measureCanvas(ctx, left, leftRole), 1); }
    if (opts.rightUnderline){ ctx.fillStyle = opts.rightColor || CONFIG.navy;
      ctx.fillRect(rx, uy, measureCanvas(ctx, right, rightRole), 1); }
    drawDivider(cx, midY);
  }
  // Single value: left-aligned at the logo's left edge, no divider.
  function drawLeftZone(text, role, midY){
    ctx.fillStyle = CONFIG.navy; ctx.textAlign = "left"; ctx.font = fontFor(role);
    ctx.fillText(text, cx + leftEdge, midY);
  }
  function drawRule(midY){
    ctx.fillStyle = CONFIG.gold;
    ctx.fillRect(cx - ruleW/2, midY, ruleW, 1);
  }
  function drawLocGroup(a, b, anchorX, align){
    // align: 'right' means the group ends at anchorX; 'left' starts at anchorX
    const aw = a ? measureCanvas(ctx,a,"location") : 0;
    const bw = b ? measureCanvas(ctx,b,"location") : 0;
    const groupW = aw + bw + ((a&&b) ? dCol + 2*pad : 0);
    let x = align === "right" ? anchorX - groupW : anchorX;
    ctx.textAlign = "left"; ctx.font = fontFor("location");
    if (a){ ctx.fillStyle=CONFIG.navy; ctx.fillText(a, x, locMidY); x += aw; }
    if (a && b){ x += pad; drawDivider(x + dCol/2, locMidY); x += dCol + pad; }
    if (b){ ctx.fillStyle=CONFIG.navy; ctx.fillText(b, x, locMidY); }
  }

  // --- Render top to bottom ---
  let yy = PAD;
  // Logo
  const logo = new Image();
  logo.onload = function(){
    ctx.drawImage(logo, cx - logoW/2, yy, logoW, logoH);
    finishDraw();
  };
  logo.onerror = finishDraw;
  logo.src = state.logoSrc;

  let locMidY = 0;
  function finishDraw(){
    let yc = PAD + logoH + CONFIG.logoToRule;
    drawRule(yc);                                  // upper rule
    yc += 1 + CONFIG.ruleToContact;

    // contact rows
    let midY = yc + rowH.name/2;
    drawTwoZone(data.name,"name", data.title,"title", midY);
    let cursor = yc + rowH.name;

    if (tels.length === 1){
      cursor += gap; drawLeftZone(tels[0],"tel", cursor + rowH.tel/2); cursor += rowH.tel;
    } else if (tels.length === 2){
      cursor += gap; drawTwoZone(tels[0],"tel",tels[1],"tel", cursor+rowH.tel/2); cursor += rowH.tel;
    } else if (tels.length === 3){
      cursor += gap; drawTwoZone(tels[0],"tel",tels[1],"tel", cursor+rowH.tel/2); cursor += rowH.tel;
      cursor += gap; drawLeftZone(tels[2],"tel", cursor+rowH.tel/2); cursor += rowH.tel;
    } else if (tels.length === 4){
      cursor += gap; drawTwoZone(tels[0],"tel",tels[1],"tel", cursor+rowH.tel/2); cursor += rowH.tel;
      cursor += gap; drawTwoZone(tels[2],"tel",tels[3],"tel", cursor+rowH.tel/2); cursor += rowH.tel;
    }
    // website row: website = blue + underline, insights = gold + no underline
    cursor += gap;
    drawTwoZone(LINKS.websiteText,"web", LINKS.insightsText,"web", cursor+rowH.web/2,
      {leftColor:CONFIG.navy, leftUnderline:true, rightColor:CONFIG.gold, rightUnderline:false});
    cursor += rowH.web;

    // lower rule
    cursor += CONFIG.contactToRule;
    drawRule(cursor);
    cursor += 1 + CONFIG.ruleToLocation;

    // location row
    locMidY = cursor + rowH.loc/2;
    drawLocGroup(data.loc1, data.loc2, cx - dCol/2 - pad, "right");
    drawDivider(cx, locMidY);
    drawLocGroup(data.loc3, data.loc4, cx + dCol/2 + pad, "left");

    onReady(cvs);
  }
}

/* Copy as Image: renders the whole signature to a PNG, scales it down to HALF
   width (proportionally) because the full-resolution image pastes too large,
   and copies the image to the clipboard ready to paste into an email.
   ClipboardItem is given a Promise<Blob> and clipboard.write is called
   synchronously, preserving the click's user-activation through the async
   canvas/encode steps. Falls back to a download if the clipboard is blocked. */
function copyAsImage(){
  const blobPromise = new Promise((resolve, reject)=>{
    try {
      renderSignatureCanvas(function(cvs){
        const half = document.createElement("canvas");
        half.width  = Math.max(1, Math.round(cvs.width  / 2));
        half.height = Math.max(1, Math.round(cvs.height / 2));
        const hctx = half.getContext("2d");
        hctx.imageSmoothingEnabled = true;
        hctx.imageSmoothingQuality = "high";
        hctx.drawImage(cvs, 0, 0, half.width, half.height);
        half.toBlob(b => b ? resolve(b) : reject(new Error("encode failed")), "image/png");
      });
    } catch (e) { reject(e); }
  });

  if (navigator.clipboard && window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })])
      .then(()=> flashToast("Image copied — paste into your email"))
      .catch(async ()=>{
        const b = await blobPromise;
        triggerDownload(b, "crosswind-signature.png");
        flashToast("Clipboard blocked — image downloaded instead");
      });
  } else {
    blobPromise.then(b=>{
      triggerDownload(b, "crosswind-signature.png");
      flashToast("Clipboard unavailable — image downloaded instead");
    });
  }
}

FIELD_IDS.forEach(k => $("f_"+k).addEventListener("input", render));

// Buttons.
$("btnCopyImg").addEventListener("click", copyAsImage);
